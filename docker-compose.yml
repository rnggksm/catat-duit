name: catat-duit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catatduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catatduit}
      POSTGRES_DB: ${POSTGRES_DB:-catatduit}
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catatduit} -d ${POSTGRES_DB:-catatduit}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catatduit}:${POSTGRES_PASSWORD:-catatduit}@db:5432/${POSTGRES_DB:-catatduit}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  # HTTPS lokal agar service worker & instal PWA bisa dites.
  # Buka https://catatduit.localhost:8443 di laptop.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
  caddy_data:
